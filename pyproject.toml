[project]
name = "dev-journal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.scripts]
journal = "journal.cli:app"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "journal"

[tool.coverage.run]
omit = ["src/journal/__main__.py"]
